version: '3.8'

services:
  report-service:
    build: .
    container_name: ms-report
    ports:
      - "8088:8088"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    networks:
      - red-compartida

networks:
  red-compartida:
    external: true